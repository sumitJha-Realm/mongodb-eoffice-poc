# MANUAL-PATH REFERENCE ONLY — scripts/one-shot.sh creates this ConfigMap/Secret
# automatically from the MCK-generated OM admin API key. Use this file only if
# you want to wire a different Ops Manager / Cloud Manager by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eoffice-om-project
  namespace: mongodb
data:
  baseUrl: "http://ops-manager-svc.mongodb.svc.cluster.local:8080"
  orgId: "<YOUR_ORG_ID>"
  projectName: "eoffice-poc"
---
apiVersion: v1
kind: Secret
metadata:
  name: eoffice-om-credentials
  namespace: mongodb
type: Opaque
stringData:
  user: "<PUBLIC_API_KEY>"
  publicApiKey: "<PRIVATE_API_KEY>"
---
# SCRAM admin user password for the deployment
apiVersion: v1
kind: Secret
metadata:
  name: eoffice-admin-password
  namespace: mongodb
type: Opaque
stringData:
  password: "eoffice123"
---
apiVersion: mongodb.com/v1
kind: MongoDBUser
metadata:
  name: eoffice-admin
  namespace: mongodb
spec:
  username: admin
  db: admin
  passwordSecretKeyRef:
    name: eoffice-admin-password
    key: password
  mongodbResourceRef:
    name: eoffice-rs
  roles:
    - db: admin
      name: root
